apiVersion: v1
kind: Service
metadata:
  name: redpanda
spec:
  type: ClusterIP
  selector:
    app: redpanda
  ports:
    - name: kafka
      protocol: TCP
      port: 9092
      targetPort: 9092
    - name: kafka-internal
      protocol: TCP
      port: 29092
      targetPort: 29092
    - name: admin
      protocol: TCP
      port: 9644
      targetPort: 9644
    - name: rest
      protocol: TCP
      port: 8082
      targetPort: 8082 